<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradDoom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140a00"/>
      <stop offset="50%" stop-color="#2a1200"/>
      <stop offset="100%" stop-color="#4a1c00"/>
    </linearGradient>
    <radialGradient id="fireDoom" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#ff3300" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#801000" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#140a00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fundo da Carta -->
  <rect width="400" height="560" fill="url(#bgGradDoom)" rx="16"/>
  <rect width="400" height="560" fill="url(#fireDoom)" rx="16"/>
  <rect x="12" y="12" width="376" height="536" fill="none" stroke="#ff4500" stroke-width="2.5" stroke-opacity="0.6" rx="12"/>

  <!-- Símbolo / Mark of the Slayer estilizado -->
  <circle cx="200" cy="180" r="105" fill="none" stroke="#ff3300" stroke-width="2" stroke-dasharray="10 5" opacity="0.7"/>
  <polygon points="200,90 230,170 200,230 170,170" fill="#ff3300" fill-opacity="0.4" stroke="#ffcc00" stroke-width="3"/>
  <polygon points="200,120 255,160 200,200 145,160" fill="none" stroke="#ff3300" stroke-width="3"/>
  <circle cx="200" cy="170" r="14" fill="#ffcc00" filter="drop-shadow(0 0 12px #ff3300)"/>

  <text x="200" y="260" font-family="'Impact', sans-serif" font-size="14" fill="#ff9900" text-anchor="middle" letter-spacing="4">RIP &amp; TEAR</text>

  <!-- Informações do Placeholder -->
  <rect x="30" y="320" width="340" height="190" fill="#120500" fill-opacity="0.9" rx="10" stroke="#ff3300" stroke-width="1.5" stroke-opacity="0.6"/>
  
  <text x="200" y="355" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#d96850" text-anchor="middle" letter-spacing="2">PLACEHOLDER DE IMAGEM</text>
  <text x="200" y="388" font-family="'Impact', sans-serif" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="2">DOOM SLAYER</text>
  <text x="200" y="415" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#ff5500" text-anchor="middle">DOOM</text>

  <rect x="50" y="435" width="300" height="1" fill="#ff3300" opacity="0.3"/>
  
  <text x="200" y="460" font-family="'Courier New', monospace" font-size="12" fill="#d87f6b" text-anchor="middle">DoomSlayerDoom</text>
  <text x="200" y="485" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#a85340" text-anchor="middle">Substituível por JPG/PNG a qualquer momento</text>
</svg>
