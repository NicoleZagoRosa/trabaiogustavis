<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradArthur" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a0d0d"/>
      <stop offset="50%" stop-color="#4a1515"/>
      <stop offset="100%" stop-color="#7a1f1d"/>
    </linearGradient>
    <radialGradient id="sunArthur" cx="50%" cy="35%" r="40%">
      <stop offset="0%" stop-color="#ff7b25" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4a1515" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fundo da Carta -->
  <rect width="400" height="560" fill="url(#bgGradArthur)" rx="16"/>
  <rect width="400" height="560" fill="url(#sunArthur)" rx="16"/>
  <rect x="12" y="12" width="376" height="536" fill="none" stroke="#ff4500" stroke-width="2" stroke-opacity="0.5" rx="12"/>

  <!-- Ícone Western / Estrela de Xerife / Chapéu estilizado -->
  <circle cx="200" cy="180" r="100" fill="none" stroke="#ff7b25" stroke-width="2" stroke-dasharray="6 4" opacity="0.6"/>
  <polygon points="200,105 218,155 270,160 230,195 242,245 200,218 158,245 170,195 130,160 182,155" fill="#ff7b25" fill-opacity="0.25" stroke="#ff7b25" stroke-width="3"/>
  <circle cx="200" cy="175" r="18" fill="#ff4500" filter="drop-shadow(0 0 10px #ff4500)"/>

  <text x="200" y="255" font-family="'Georgia', serif" font-size="13" font-weight="700" fill="#ffb48f" text-anchor="middle" letter-spacing="3">VAN DER LINDE GANG</text>

