  <rect x="30" y="320" width="340" height="190" fill="#180707" fill-opacity="0.9" rx="10" stroke="#ff4500" stroke-width="1.5" stroke-opacity="0.6"/>
  
  <text x="200" y="355" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#d97768" text-anchor="middle" letter-spacing="2">PLACEHOLDER DE IMAGEM</text>
  <text x="200" y="388" font-family="'Georgia', serif" font-size="23" font-weight="800" fill="#ffffff" text-anchor="middle">ARTHUR MORGAN</text>
  <text x="200" y="415" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#ff7b25" text-anchor="middle">Red Dead Redemption 2</text>

