      <stop offset="0%" stop-color="#12061f"/>
      <stop offset="50%" stop-color="#24083d"/>
      <stop offset="100%" stop-color="#3d0d66"/>
    </linearGradient>
    <radialGradient id="magicBayo" cx="50%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.8"/>
