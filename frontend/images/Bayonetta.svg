  <circle cx="200" cy="180" r="15" fill="#f43f5e" filter="drop-shadow(0 0 10px #f43f5e)"/>

  <text x="200" y="255" font-family="'Didot', serif" font-size="13" font-style="italic" fill="#fbcfe8" text-anchor="middle" letter-spacing="3">UMBRA WITCH</text>

