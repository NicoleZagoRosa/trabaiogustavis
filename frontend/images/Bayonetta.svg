  <text x="200" y="388" font-family="'Didot', 'Georgia', serif" font-size="26" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">BAYONETTA</text>
  <text x="200" y="415" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#e879f9" text-anchor="middle">Bayonetta</text>

